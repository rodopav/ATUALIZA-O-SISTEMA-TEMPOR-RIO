appId: br.com.rodopav.financeiro
productName: Sistema Financeiro Rodopav
copyright: © 2026 Rodopav Central
directories:
  output: release/user
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,mjs,ts}'
  - '!{.eslintrc.cjs,.prettierrc,.gitignore,.editorconfig}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{.env,.env.*,README.md,electron-builder*.yml}'
  - '!scripts/**'
  - '!release/**'
asar: true
asarUnpack:
  - '**/*.node'
publish:
  - provider: github
    owner: rodopav
    repo: ATUALIZA-O-SISTEMA-TEMPOR-RIO
    releaseType: release
    channel: latest
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.png
  # publisherName removido — sem code signing, electron-updater rejeita
  # a atualização ao tentar verificar a assinatura. Para reativar, é
  # preciso assinar com certificado de code signing ($300+/ano).
  verifyUpdateCodeSignature: false
  artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Sistema Financeiro
  uninstallDisplayName: Sistema Financeiro Rodopav
mac:
  target:
    - target: dmg
      arch: [universal]
  category: public.app-category.finance
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Office;Finance
  artifactName: ${productName}-${version}.${ext}
protocols:
  - name: rodofin
    schemes: [rodofin]
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
